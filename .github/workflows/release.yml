name: Release package

on:
  workflow_call:
    inputs:
      expected_sha:
        description: Commit that passed Package readiness
        required: true
        type: string
    secrets:
      NPM_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: package-release-${{ inputs.expected_sha }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@wieslawsoltes'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Assemble qualified runtime and release inventory
        run: npm run pack:release
      - name: Test the exact release package
        run: |
          packages=( artifacts/*.tgz )
          node scripts/package-test.mjs --tarball "${packages[0]}"
      - name: Publish GitHub package if version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          package_name=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).name')
          package_version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          if npm view "$package_name@$package_version" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo 'Package version already published.'
          else
            packages=( artifacts/*.tgz )
            npm publish "./${packages[0]}" --registry=https://npm.pkg.github.com --provenance=false --ignore-scripts
          fi
      - name: Publish immutable release assets
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_SHA: ${{ inputs.expected_sha }}
        shell: bash
        run: |
          package_version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json", "utf8")).version')
          release_tag="v$package_version"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo 'Existing release retained without replacing assets.'
          else
            gh release create "$release_tag" --target "$VERIFIED_SHA" --title "SkiaSharp Web $package_version" --notes-file docs/release-notes.md artifacts/*.tgz artifacts/SHA256SUMS artifacts/SHA256SUMS.txt artifacts/package-manifest.json artifacts/sbom.cdx.json
          fi
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          if [[ "$package_version" == *-* ]]; then echo 'dist_tag=next' >> "$GITHUB_OUTPUT"; else echo 'dist_tag=latest' >> "$GITHUB_OUTPUT"; fi
          git fetch --no-tags origin "refs/tags/$release_tag:refs/tags/$release_tag"
          if [[ "$(git rev-list -n 1 "$release_tag")" == "$VERIFIED_SHA" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'Existing release identifies another commit; npm publication skipped.'
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: release-package-${{ inputs.expected_sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error

  npm:
    needs: release
    if: needs.release.outputs.publish == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/npm-publish.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      expected_sha: ${{ inputs.expected_sha }}
      dist_tag: ${{ needs.release.outputs.dist_tag }}
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
