name: Refresh release documentation
on:
  push:
    branches: [main]
    paths: ['scripts/audit-v05.mjs', 'scripts/publish-release.mjs', 'docs/RELEASE-0.5.md', 'docs/VERIFICATION-0.5.json', '.github/workflows/release-docs.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-documentation
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate evidence-reviewed conformance and versioned documentation
        run: node scripts/publish-release.mjs
      - name: Verify native boundary certificates and source integrity
        run: |
          npm run check
          node --test tests/native-canvas-boundaries.test.mjs tests/native-memory.test.mjs tests/gpu-readback.test.mjs tests/runtime-performance.test.mjs
      - name: Commit generated release documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json README.md COMPATIBILITY.md docs/ dist/README.md dist/COMPATIBILITY.md dist/compatibility.json dist/docs/ dist/native/ dist/index.html dist/qualification.html dist/VERIFICATION.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: publish evidence-reviewed 0.5 audit and verification guides'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
