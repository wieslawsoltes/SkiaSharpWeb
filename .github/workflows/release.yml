name: Release package
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag matching package.json, for example v0.5.0
        required: true
        type: string
      dry_run:
        description: Validate and upload artifacts without creating a draft release
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: package-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      commit: ${{ steps.tag.outputs.commit }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - id: tag
        run: node scripts/check-release-tag.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - name: Install native document readers and pinned browser
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          python -m pip install PyMuPDF==1.26.6 Pillow==11.3.0 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - run: npm run check && npm run release:check
      - run: npm test
      - run: python scripts/verify-package-browser.py
      - run: node scripts/verify-release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-candidate-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-evidence-${{ github.run_id }}
          path: |
            test-output/package-browser/
            test-output/package-verification.json
          retention-days: 30
  draft:
    if: github.event_name == 'push' || !inputs.dry_run
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ github.run_id }}
          path: artifacts
      - name: Create a draft with the exact tested tarball (never overwrite a release)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.qualify.outputs.tag }}
          VERSION: ${{ needs.qualify.outputs.version }}
          PRERELEASE: ${{ needs.qualify.outputs.prerelease }}
          SOURCE_COMMIT: ${{ needs.qualify.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'Tested source: `%s`\n\nInstall the attached npm tarball. Check SHA256SUMS and package-manifest.json. The package contains no fonts or demo assets. See docs/RELEASING.md before publishing to npm. Complete SkiaSharp parity and physical GPU qualification are not claimed.\n' "$SOURCE_COMMIT" > notes.md
          args=(--repo "$GH_REPO" --draft --verify-tag --title "SkiaSharp Web $VERSION" --notes-file notes.md)
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" artifacts/*.tgz artifacts/SHA256SUMS artifacts/package-manifest.json artifacts/sbom.cdx.json "${args[@]}"
