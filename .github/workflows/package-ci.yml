name: Package readiness
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: package-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    name: Package (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: npm run release:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: package-${{ matrix.os }}-${{ matrix.node }}
          path: |
            artifacts/
            test-output/package-verification.json
          retention-days: 14
  native:
    name: Native and .NET regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: npm ci --ignore-scripts
      - name: Install independent document verification tools
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          python -m pip install PyMuPDF==1.26.6 Pillow==11.3.0
      - run: npm run build && npm run check
      - name: Full native suite and fresh .NET reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-output/package-native
          node --disallow-code-generation-from-strings tests/packaging/font-csp.mjs
          npm test | tee test-output/package-native/tests.log
          dotnet run --project tools/contract-reference -c Release -- test-output/package-native/reference.json dist/fonts/DejaVuSans.ttf
          node scripts/compare-contracts.mjs test-output/package-native/reference.json test-output/package-native/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: package-native
          path: test-output/package-native/
          retention-days: 14
  browser:
    name: Installed package browser
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --ignore-scripts
      - run: npm run test:package
      - run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - run: node scripts/verify-package-bundle.mjs
      - run: python scripts/verify-package-browser.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: package-browser
          path: test-output/package-browser/
          retention-days: 14
  ready:
    name: ready
    if: always()
    needs: [package, native, browser]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every release gate
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$PACKAGE_RESULT" = success && test "$NATIVE_RESULT" = success && test "$BROWSER_RESULT" = success
