name: Validate and publish Graphics Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Build and verify native Skia']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF and XPS parser
        run: python -m pip install PyMuPDF==1.26.6 Pillow==11.3.0
      - name: Install document verification tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Validate source and bundled assets
        run: npm run check
      - name: Run native Skia integration suite
        run: npm test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload sample app
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
