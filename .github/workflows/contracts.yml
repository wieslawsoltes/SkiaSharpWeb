name: Portable API and native document contracts
on:
  push:
    branches: [main]
    paths: ['dist/lib/**', 'dist/vendor/**', 'tools/contract-reference/**', 'scripts/compare-contracts.mjs', 'tests/completion-contracts.test.mjs', 'tests/document-observability.test.mjs', '.github/workflows/contracts.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Build and verify native Skia']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install PyMuPDF==1.26.6
      - name: Execute independent .NET contract reference
        run: dotnet run --project tools/contract-reference -c Release -- test-output/contracts/reference.json dist/fonts/DejaVuSans.ttf
      - name: Compare public JavaScript contracts against .NET
        run: node scripts/compare-contracts.mjs test-output/contracts/reference.json test-output/contracts/report.json
      - name: Require actual compiled PDF decisions and glyph callbacks
        env:
          SKIA_REQUIRE_PDF_DIAGNOSTICS: '1'
        run: node --test tests/completion-contracts.test.mjs tests/document-observability.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-contracts-${{ github.sha }}
          path: |
            test-output/contracts/
            test-output/document-observability/
          retention-days: 14
