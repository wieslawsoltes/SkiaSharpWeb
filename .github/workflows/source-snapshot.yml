name: Source snapshot
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Qualify and publish native runtime', 'Refresh release documentation']
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: source-snapshot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Refresh generated documentation for the committed runtime
        run: npm run coverage && npm run docs
      - name: Package source and generated documentation without font binaries
        shell: bash
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > SOURCE_REVISION.txt
          { git ls-files -z; printf 'SOURCE_REVISION.txt\0'; find dist/docs dist/native -type f -print0; } | sort -zu > artifacts/source-files.txt
          tar --exclude='*.ttf' --exclude='*.otf' --exclude='*.woff' --exclude='*.woff2' --exclude='*.ttc' --exclude='*.otc' --null -T artifacts/source-files.txt -czf artifacts/SkiaSharpWeb-source.tar.gz
          sha256sum artifacts/SkiaSharpWeb-source.tar.gz > artifacts/SHA256SUMS
          rm artifacts/source-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: source-${{ steps.source.outputs.sha }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
